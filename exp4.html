<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exp4</title>
</head>
<body>
    <h1>Hotel Room Booking Form</h1>
    <form action="#" method="post">
        <div>
        <label for="Full Name">Full Name:</label>
        <input type="text" id="Full Name" name="FullName" required>
        <br><br>
        <label for="email">Email:</label></label>
        <input type="email" id="email" required>
        <br><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" required>
        <br><br>
        <label for="checkin">Check-in date;</label></label>
        <input type="date" id="checkin" required>
        <br><br>
        <label for="checkout">Check-out date:</label>
        <input type="date" id="checkout" required>
        <br><br>
        <!-- Room Type -->
        <label for="roomtype">Room Type:</label>
        <select id="roomtype" required>
            <option value="">Single room</option>
            <option value="single">Double room</option>
            <option value="double">Deluxe room</option>
            <option value="suite">Suite</option>
        </select>
        <br><br>
        <!-- Number of Guests -->
        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" min="1" max="10" required>
        <br><br>
        <!-- Special Requests -->
        <label for="Special requests">Special Requests:</label>
        <br>
        <textarea id="Special requests" name="SpecialRequests" rows="4" cols="50"></textarea>
        <br><br>
        <!-- Submit & reset Button -->
        <input type="submit" value="Submit Now">
        <input type="reset" value="Reset Now">
        <br><br>
        </div>
    </form>
</body>
</html>
