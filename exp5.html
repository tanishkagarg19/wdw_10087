<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student registration form</title>
</head>
<body>
    <h1 align="center">Student Registration Form</h1>
    <hr>
    <form action ="#" method="post">
        <div>
            <label for="Full Name">Full Name:</label>
            <input type="text" id="Full Name" name="Full Name" placeholder="Enter your full name" required>
            <br><br>
            <label for="Email">Email:</label>
            <input type="email" id="Email" name="Email" placeholder="Enter your valid email address" required>
            <br><br>
            <label for="Password">Password:</label>
            <input type="password" id="Password" name="Password" placeholder="Enter password" required>
            <br><br>
            <label for="Gender">Gender:</label>
            <input type="radio" id="Male" value="Male" name="Gender" required>
            <label for="Male">Male</label>
            <input type="radio" id="Female" value="Female" name="Gender" required>
            <label for="Female">Female</label>
            <input type="radio" id="Other" value="Other" name="Gender" required>
            <label for="Other">Other</label>
            <br><br>
            <label for="Course">Course:</label>
            <select id="Course" name="Course" required>
                <option value=" ">-- select course -- </option>
                <option value="ELCE">ELCE</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
            </select>
            <br><br>
            <label for="Contact Number">Contact Number:</label>
            <input type="tel" id="Contact Number" name="Contact Number" placeholder="Enter phone number" required>
            <br><br>
            <label for="Address">Address:</label>
            <br>
            <textarea id="Address" name="Address" placeholder="Enter your address" rows="4" cols="50"></textarea>
            <br><br>
            <input type="submit" value="Register ">
            <input type="reset" value="Clear ">
            <br>
            <hr>
            
        </div>
    </form>
    <p align="center">© 2025 Student Registration Portal</p>
</body>
</html>
